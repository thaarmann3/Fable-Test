<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ball Blast">
<title>Ball Blast</title>
<style>
  :root {
    --bg1: #1a1c33; --bg2: #0d0d1a;
    --panel: rgba(255,255,255,0.08);
    --panel2: rgba(255,255,255,0.12);
    --yellow: #ffcc26;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; background: var(--bg2);
    font-family: -apple-system, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
    color: #fff; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  .screen {
    position: fixed; inset: 0; display: none; flex-direction: column;
    background: linear-gradient(var(--bg1), var(--bg2));
    padding: calc(var(--safe-top) + 14px) 20px calc(var(--safe-bottom) + 14px);
  }
  .screen.active { display: flex; }
  .scroll { overflow-y: auto; touch-action: pan-y; flex: 1; }

  h1.logo { text-align: center; font-size: 54px; font-weight: 900; line-height: 1.02; letter-spacing: 1px; }
  h1.logo .a { color: var(--yellow); display: block; }
  h1.logo .b { color: #fff; display: block; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel2); border-radius: 999px;
    padding: 9px 16px; font-weight: 800; font-size: 17px;
  }
  .coin { width: 18px; height: 18px; border-radius: 50%; background: var(--yellow);
    display: inline-block; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.25); }
  .coin::after { content: "$"; display: block; text-align: center; font-size: 12px;
    font-weight: 900; color: rgba(0,0,0,0.55); line-height: 18px; }

  .btn {
    display: block; width: 100%; border: 0; border-radius: 15px;
    padding: 15px; font-size: 18px; font-weight: 800; font-family: inherit;
    color: #fff; background: var(--panel2); cursor: pointer;
  }
  .btn.primary { background: var(--yellow); color: #111; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; transform: none; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .topbar .back {
    width: 40px; height: 40px; border-radius: 50%; border: 0; flex: 0 0 auto;
    background: var(--panel2); color: #fff; font-size: 18px; font-weight: 800; cursor: pointer;
  }
  .topbar h2 { flex: 1; text-align: center; font-size: 19px; font-weight: 900; }
  .topbar .spacer { width: 40px; flex: 0 0 auto; }

  /* Level grid */
  #levelGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; padding-bottom: 20px; }
  .lvl {
    border: 0; border-radius: 14px; min-height: 68px; background: var(--panel2);
    color: #fff; font-size: 20px; font-weight: 900; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .lvl.locked { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); font-size: 17px; }
  .lvl.current { background: var(--yellow); color: #111; }
  .lvl .sub { font-size: 11px; font-weight: 700; }
  .lvl .crown { font-size: 12px; }
  .mapHdr {
    grid-column: 1 / -1; padding: 12px 2px 2px;
    font-size: 12px; font-weight: 900; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.45);
  }

  /* Upgrade cards */
  .card {
    display: flex; align-items: center; gap: 13px;
    background: var(--panel); border-radius: 17px; padding: 13px; margin-bottom: 12px;
  }
  .card .icon {
    width: 50px; height: 50px; border-radius: 13px; flex: 0 0 auto;
    background: rgba(255,204,38,0.15); display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 16px; font-weight: 900; }
  .card .lv { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.45); margin-left: 5px; }
  .card .blurb { font-size: 11.5px; color: rgba(255,255,255,0.55); margin: 2px 0; }
  .card .fx { font-size: 12.5px; font-weight: 800; color: rgba(255,255,255,0.8); }
  .card .fx .next { color: var(--yellow); }
  .card .buy {
    border: 0; border-radius: 12px; width: 66px; height: 46px; flex: 0 0 auto;
    font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer;
    background: var(--yellow); color: #111;
  }
  .card .buy.cant { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); }

  /* Game */
  #gameScreen { padding: 0; background: #14172a; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hud {
    position: absolute; left: 0; right: 0; top: var(--safe-top);
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  #pauseBtn {
    width: 38px; height: 38px; border-radius: 50%; border: 0; flex: 0 0 auto;
    background: rgba(255,255,255,0.14); color: #fff; font-size: 14px; cursor: pointer;
  }
  #hudMid { flex: 1; pointer-events: none; }
  #hudLevel { text-align: center; font-size: 13px; font-weight: 900; opacity: 0.9; margin-bottom: 5px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  #progressTrack { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.15); overflow: hidden; }
  #progressFill { height: 100%; width: 0%; border-radius: 999px; background: var(--yellow); transition: width 0.15s; }
  #hudCoins { font-size: 15px; }

  .overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    background: rgba(0,0,0,0.78); padding: 30px;
    padding-top: calc(var(--safe-top) + 30px); padding-bottom: calc(var(--safe-bottom) + 30px);
  }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 31px; font-weight: 900; text-align: center; }
  .overlay .stack { width: 100%; max-width: 340px; }
  #resultStats {
    width: 100%; max-width: 340px; background: var(--panel);
    border-radius: 15px; padding: 16px; font-size: 15px; font-weight: 700;
  }
  #resultStats .row { display: flex; justify-content: space-between; padding: 4px 0; }
  #resultStats .row b { color: var(--yellow); font-weight: 900; }
  #resultStats hr { border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 7px 0; }

  #startHint {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; pointer-events: none;
  }
  #startHint.active { display: flex; }
  #startHint .big { font-size: 29px; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  #startHint .small { font-size: 14px; font-weight: 600; opacity: 0.85; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

  .center { text-align: center; }
  .reset { background: none; border: 0; color: rgba(255,255,255,0.35);
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 10px; }
  .statline { color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 600; }

  /* Cannon skin cards */
  .skinCard {
    display: flex; align-items: center; gap: 13px;
    background: var(--panel); border-radius: 17px; padding: 13px; margin-bottom: 12px;
  }
  .skinCard.sel { outline: 2px solid var(--yellow); }
  .skinCard .preview {
    width: 60px; height: 60px; border-radius: 13px; flex: 0 0 auto;
    background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center;
  }
  .skinCard .info { flex: 1; min-width: 0; }
  .skinCard .name { font-size: 16px; font-weight: 900; }
  .skinCard .req { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .skinCard .action {
    border: 0; border-radius: 12px; min-width: 76px; height: 44px; flex: 0 0 auto;
    font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer; padding: 0 12px;
    background: var(--yellow); color: #111;
  }
  .skinCard .action.cant { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); }
  .skinCard .action.sel { background: rgba(255,255,255,0.08); color: var(--yellow); }

  /* Difficulty selector */
  .diffLabel { font-size: 12px; font-weight: 800; letter-spacing: 1px;
    color: rgba(255,255,255,0.45); margin-bottom: 7px; }
  .seg { display: inline-flex; gap: 5px; background: rgba(255,255,255,0.07);
    border-radius: 12px; padding: 4px; }
  .seg button {
    border: 0; border-radius: 9px; padding: 8px 13px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 800;
    background: transparent; color: rgba(255,255,255,0.55);
  }
  .seg button.sel { background: var(--yellow); color: #111; }
</style>
</head>
<body>

<!-- MENU -->
<div id="menuScreen" class="screen active">
  <div style="flex:1"></div>
  <h1 class="logo"><span class="a">BALL</span><span class="b">BLAST</span></h1>
  <div class="center" style="margin-top:16px"><span class="pill"><span class="coin"></span><span id="menuCoins">0</span></span></div>
  <div class="center" style="margin-top:10px"><span class="statline" id="menuStats"></span></div>
  <div style="flex:1"></div>
  <div class="stack" style="max-width:340px;width:100%;margin:0 auto">
    <button class="btn primary" id="playBtn" style="padding:18px">
      <div style="font-size:23px;font-weight:900">PLAY</div>
      <div style="font-size:12px;font-weight:700;opacity:0.7" id="playSub">Level 1</div>
    </button>
    <button class="btn" id="levelsBtn">&#9638;&nbsp; Levels</button>
    <button class="btn" id="upgradesBtn">&#8679;&nbsp; Upgrades</button>
    <button class="btn" id="cannonsBtn">&#9678;&nbsp; Customize</button>
  </div>
  <div class="center" style="margin-top:22px">
    <div class="diffLabel">BALL SPEED</div>
    <div class="seg" id="diffSeg"></div>
  </div>
  <div class="center" style="margin-top:12px">
    <div class="diffLabel">MYSTERY BALLS</div>
    <div class="seg" id="mysterySeg"></div>
  </div>
  <div style="flex:1"></div>
  <div class="center"><button class="reset" id="resetBtn">Reset Progress</button></div>
</div>

<!-- LEVEL SELECT -->
<div id="levelsScreen" class="screen">
  <div class="topbar">
    <button class="back" data-nav="menu">&#8592;</button>
    <h2>Levels</h2>
    <div class="spacer"></div>
  </div>
  <div class="scroll"><div id="levelGrid"></div></div>
</div>

<!-- UPGRADES -->
<div id="upgradesScreen" class="screen">
  <div class="topbar">
    <button class="back" data-nav="back">&#8592;</button>
    <h2>Upgrades</h2>
    <div class="spacer"></div>
  </div>
  <div class="center" style="margin-bottom:12px"><span class="pill"><span class="coin"></span><span id="shopCoins">0</span></span></div>
  <div class="scroll"><div id="upgradeList"></div></div>
</div>

<!-- CANNON SKINS -->
<div id="cannonsScreen" class="screen">
  <div class="topbar">
    <button class="back" data-nav="menu">&#8592;</button>
    <h2>Customize</h2>
    <div class="spacer"></div>
  </div>
  <div class="center" style="margin-bottom:10px"><span class="pill"><span class="coin"></span><span id="skinCoins">0</span></span></div>
  <div class="center" style="margin-bottom:12px"><div class="seg" id="cosTabs"></div></div>
  <div class="scroll"><div id="skinList"></div></div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <button id="pauseBtn">&#10074;&#10074;</button>
    <div id="hudMid">
      <div id="hudLevel">LEVEL 1</div>
      <div id="progressTrack"><div id="progressFill"></div></div>
    </div>
    <span class="pill" id="hudCoins"><span class="coin"></span><span id="gameCoins">0</span></span>
  </div>
  <div id="startHint">
    <div class="big">TAP TO START</div>
    <div class="small" id="hintMap"></div>
    <div class="small">Hold to fire &mdash; drag to move</div>
  </div>
  <div class="overlay" id="pauseOverlay">
    <h2>PAUSED</h2>
    <div class="stack">
      <button class="btn primary" id="resumeBtn">Resume</button>
      <button class="btn" id="restartBtn">Restart Level</button>
      <button class="btn" id="quitBtn">Main Menu</button>
    </div>
  </div>
  <div class="overlay" id="resultOverlay">
    <h2 id="resultTitle">LEVEL CLEAR!</h2>
    <div id="resultStats"></div>
    <div class="stack" id="resultButtons"></div>
  </div>
</div>

<script>
"use strict";

/* ============================== Persistence ============================== */

const SAVE_KEY = "ballblast.save.v1";
let storageOK = true;
try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); }
catch (e) { storageOK = false; }

const state = loadState();

function loadState() {
  const fresh = { coins: 0, highest: 1, completed: {}, upg: {}, difficulty: "normal",
                  equipped: { cannon: "classic", bullet: "standard", wheel: "standard" },
                  owned: {}, streak: 0, mystery: "normal" };
  if (!storageOK) return fresh;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return fresh;
    const s = JSON.parse(raw);
    // Old multi-shot purchases convert to 8 fire-rate tiers each, which
    // grant the same number of bullet streams under the new system.
    const upg = Object.assign({}, s.upg || {});
    if (upg.multiShot) {
      upg.fireRate = (upg.fireRate | 0) + 8 * upg.multiShot;
      delete upg.multiShot;
    }
    // Migrate older saves that used a single "skin" field.
    const eq = s.equipped || {};
    let owned = s.owned;
    if (!owned) {
      owned = {};
      if (s.ownedSkins) for (const k in s.ownedSkins) owned["cannon:" + k] = true;
    }
    return {
      coins: Math.max(0, s.coins | 0),
      highest: Math.max(1, s.highest | 0),
      completed: s.completed || {},
      upg,
      difficulty: typeof s.difficulty === "string" ? s.difficulty : "normal",
      equipped: {
        cannon: eq.cannon || s.skin || "classic",
        bullet: eq.bullet || "standard",
        wheel: eq.wheel || "standard",
      },
      owned,
      streak: Math.max(0, s.streak | 0),
      mystery: typeof s.mystery === "string" ? s.mystery : "normal",
    };
  } catch (e) { return fresh; }
}

function saveState() {
  if (!storageOK) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ============================== Balance ============================== */

const COINS_PER_HP = 0.7;
const bulletDamage   = l => 1 + l;
const shotsPerSecond = l => Math.min(3.0 + 0.35 * l, 12);
const streamsFromRate = l => 1 + Math.floor(l / 8); // every 8 fire-rate tiers adds a stream
const coinMultiplier = l => 1.0 + 0.20 * l;

/* Upgrades are infinite: no caps, and every tier N costs the same
   regardless of which upgrade it is. */
const tierCost = l => Math.round(20 * Math.pow(1.28, l));

/* Winning levels back to back multiplies the coins you earn:
   +20% per consecutive win, up to x3. A death resets it. */
const streakMult = s => 1 + 0.2 * Math.min(Math.max(0, s - 1), 10);

const UPGRADES = [
  { id: "firepower", name: "Firepower", icon: "\u{1F525}",
    blurb: "Each bullet deals more damage",
    fx: l => bulletDamage(l) + " dmg" },
  { id: "fireRate",  name: "Fire Rate", icon: "⚡",
    blurb: "Shoot faster — every 8 tiers adds a bullet stream (max 6 drawn, then bonus damage)",
    fx: l => {
      const s = streamsFromRate(l), v = Math.min(s, MAX_VISIBLE_STREAMS);
      return shotsPerSecond(l).toFixed(1) + "/s × " + v +
             (s > v ? " (×" + (s / v).toFixed(2) + " dmg)" : "");
    } },
  { id: "coinBonus", name: "Coin Bonus", icon: "\u{1F4B0}",
    blurb: "Balls drop more coins",
    fx: l => "+" + Math.round((coinMultiplier(l) - 1) * 100) + "% coins" },
  { id: "shieldUp", name: "Shield", icon: "\u{1F6E1}",
    blurb: "Invincibility power-up lasts longer",
    fx: l => (4 + 0.3 * l).toFixed(1) + "s" },
  { id: "twinUp", name: "Twin Cannon", icon: "\u{2795}",
    blurb: "Twin cannon power-up lasts longer",
    fx: l => (5 + 0.4 * l).toFixed(1) + "s" },
  { id: "spreadUp", name: "Spread Shot", icon: "\u{1F3AF}",
    blurb: "Spread power-up fires more angled bullets",
    fx: l => (1 + Math.floor(l / 5)) + " pairs" },
  { id: "coinFrenzy", name: "Coin Frenzy", icon: "\u{1F4B8}",
    blurb: "Coin Frenzy power-up multiplies coins more",
    fx: l => "×" + (2 + 0.1 * l).toFixed(1) },
];

/* Power-ups dropped by mystery "?" balls. Timed buffs; upgrades above
   improve their duration or power. */
const POWERUPS = {
  shield: { name: "Shield",      icon: "\u{1F6E1}", color: "#5db5ff", dur: () => 4 + 0.3 * upgLevel("shieldUp") },
  twin:   { name: "Twin Cannon", icon: "\u{2795}",  color: "#ffd84d", dur: () => 5 + 0.4 * upgLevel("twinUp") },
  spread: { name: "Spread Shot", icon: "\u{1F3AF}", color: "#ff8855", dur: () => 6 },
  coinx:  { name: "Coin Frenzy", icon: "\u{1F4B8}", color: "#7ce8a0", dur: () => 6 },
};

/* Difficulty scales how fast balls fall. Bounce heights stay the same. */
const DIFFICULTIES = [
  { id: "easy",   name: "Easy",   mult: 0.5 },
  { id: "normal", name: "Normal", mult: 0.7 },
  { id: "hard",   name: "Hard",   mult: 1.0 },
  { id: "insane", name: "Insane", mult: 1.3 },
];
const currentDifficulty = () =>
  DIFFICULTIES.find(d => d.id === state.difficulty) || DIFFICULTIES[1];

/* Chance that each spawned ball brings a mystery ball along. */
const MYSTERY_RATES = [
  { id: "rare",   name: "Rare",   p: 0.06 },
  { id: "normal", name: "Normal", p: 0.11 },
  { id: "often",  name: "Often",  p: 0.18 },
  { id: "frenzy", name: "Frenzy", p: 0.30 },
];
const currentMystery = () =>
  MYSTERY_RATES.find(d => d.id === state.mystery) || MYSTERY_RATES[1];

/* ============================== Cosmetics ============================== */

/* Three customization categories. Items unlock by reaching a level
   milestone (level) or by spending coins (cost); no field = default. */
const COSMETICS = {
  cannon: {
    label: "Cannon",
    items: [
      { id: "classic",   name: "Classic",   body: "#ffcc26", dark: "#2a2a3a" },
      { id: "crimson",   name: "Crimson",   body: "#f25555", dark: "#33181d", level: 5 },
      { id: "tangerine", name: "Tangerine", body: "#ff9a3c", dark: "#3a2410", level: 10 },
      { id: "emerald",   name: "Emerald",   body: "#52d273", dark: "#142a1b", level: 15 },
      { id: "ocean",     name: "Ocean",     body: "#4db0f0", dark: "#102a3d", level: 20 },
      { id: "rose",      name: "Rose",      body: "#f06cb2", dark: "#38142a", level: 25 },
      { id: "frost",     name: "Frost",     body: "#a8e4ff", dark: "#1d3442", level: 35 },
      { id: "toxic",     name: "Toxic",     body: "#b8e83c", dark: "#28330e", level: 50 },
      { id: "royal",     name: "Royal",     body: "#8a5cf0", dark: "#1f1338", level: 65 },
      { id: "shadow",    name: "Shadow",    body: "#3c3c4a", dark: "#101016", level: 80 },
      { id: "pearl",     name: "Pearl",     body: "#f2f2f7", dark: "#5a5a6e", level: 100 },
      { id: "neon",      name: "Neon",      body: "#c95df0", dark: "#220f33", cost: 2500 },
      { id: "mint",      name: "Mint",      body: "#7ce8c4", dark: "#143228", cost: 5000 },
      { id: "magma",     name: "Magma",     body: "#f0563c", dark: "#330d06", cost: 12000 },
      { id: "gold",      name: "Gold",      body: "#ffd93e", dark: "#5c4612", cost: 25000 },
      { id: "ruby",      name: "Ruby",      body: "#e8244e", dark: "#36081a", cost: 50000 },
    ],
  },
  bullet: {
    label: "Bullets",
    items: [
      { id: "standard", name: "Standard",  color: "#ffeb80", w: 5, h: 16 },
      { id: "ember",    name: "Ember",     color: "#ffaa44", w: 5, h: 16, level: 8 },
      { id: "shard",    name: "Ice Shard", color: "#7ce0ff", w: 4, h: 18, level: 18 },
      { id: "venom",    name: "Venom",     color: "#9ef25c", w: 5, h: 16, level: 28 },
      { id: "rosefire", name: "Rosefire",  color: "#ff7cc8", w: 5, h: 16, level: 40 },
      { id: "violet",   name: "Violet",    color: "#c490ff", w: 5, h: 16, level: 55 },
      { id: "blade",    name: "Blade",     color: "#ffffff", w: 3, h: 21, cost: 2000 },
      { id: "heavy",    name: "Heavy",     color: "#ff8855", w: 8, h: 13, cost: 8000 },
      { id: "gold",     name: "Gold",      color: "#ffd93e", w: 6, h: 16, cost: 20000 },
      { id: "laser",    name: "Laser",     color: "#ff4d6a", w: 4, h: 26, cost: 40000 },
    ],
  },
  wheel: {
    label: "Wheels",
    items: [
      { id: "standard", name: "Standard", tire: "#2a2a3a", hub: "#8c8c99" },
      { id: "crimson",  name: "Crimson",  tire: "#5c1f26", hub: "#f0a0a8", level: 12 },
      { id: "ice",      name: "Ice",      tire: "#274a5e", hub: "#bce8ff", level: 30 },

const ownKey = (cat, id) => cat + ":" + id;
function itemUnlocked(cat, item) {
  if (item.level) return state.highest >= item.level;
  if (item.cost) return !!state.owned[ownKey(cat, item.id)];
  return true;
}
function equipped(cat) {
  const items = COSMETICS[cat].items;
  const item = items.find(i => i.id === state.equipped[cat]);
  return item && itemUnlocked(cat, item) ? item : items[0];
}

const upgLevel = id => state.upg[id] | 0;
const upgCost = u => tierCost(upgLevel(u.id));

/* At most 6 bullet streams are drawn; streams earned beyond that fold
   into per-bullet damage instead, so DPS keeps scaling without the
   screen filling up. */
const MAX_VISIBLE_STREAMS = 6;

function loadout() {
  const fr = upgLevel("fireRate");
  const streams = streamsFromRate(fr);
  const visible = Math.min(streams, MAX_VISIBLE_STREAMS);
  const damage = bulletDamage(upgLevel("firepower"));
  return {
    damage,
    bulletDmg: Math.max(1, Math.round(damage * streams / visible)),
    shotsPerSec: shotsPerSecond(fr),
    streams: visible,
    coinMult: coinMultiplier(upgLevel("coinBonus")),
  };
}

/* ============================== Levels (endless) ============================== */

function levelConfig(n) {
  n = Math.max(1, n | 0);
  const isBoss = n % 10 === 0;
  const baseHP = Math.max(5, Math.floor(5.5 * Math.pow(n, 1.3)));
  if (isBoss) {
    return { number: n, count: Math.min(1 + Math.floor(n / 15), 6), tier: 3, hp: baseHP * 4,
             interval: 7.0, isBoss, firstReward: 80 + 45 * n, replayReward: 12 + 5 * n };
  }
  let tier = 2;
  if (n < 4) tier = 1;
  else if (n % 7 === 0 && n >= 8) tier = 3;
  // Level length grows gradually with progression, varied ±30% by a hash
  // of the level number — deterministic, so replays are the same length.
  const baseCount = Math.min(4 + (n - 1) * 0.6, 22);
  const h = Math.abs(Math.sin(n * 12.9898) * 43758.5453) % 1;
  const count = Math.max(3, Math.round(baseCount * (0.7 + h * 0.6)));
  return { number: n, count, tier, hp: baseHP,
           interval: Math.max(2.4, 5.0 - 0.06 * n), isBoss, firstReward: 50 + 28 * n, replayReward: 8 + 4 * n };
}

function totalHPPool(cfg) {
  let per = 0, hp = cfg.hp, count = 1;
  for (let t = 0; t <= cfg.tier; t++) { per += hp * count; hp = Math.max(1, hp >> 1); count *= 2; }
  return Math.max(1, per * cfg.count);
}

function shortNum(v) {
  if (v < 1000) return "" + v;
  if (v < 1e6) { const k = v / 1000; return k < 10 ? k.toFixed(1) + "K" : Math.round(k) + "K"; }
  const m = v / 1e6; return m < 10 ? m.toFixed(1) + "M" : Math.round(m) + "M";
}

function renderLevels() {
  const grid = document.getElementById("levelGrid");
  grid.innerHTML = "";
  const count = Math.max(60, state.highest + 12);
  for (let n = 1; n <= count; n++) {
    if ((n - 1) % 10 === 0) {
      const hdr = document.createElement("div");
      hdr.className = "mapHdr";
      hdr.textContent = themeFor(n).name.toUpperCase() + " MAP";
      grid.appendChild(hdr);
    }
    const unlocked = n <= state.highest;
    const completed = !!state.completed[n];
    const isBoss = n % 10 === 0;
    const cell = document.createElement("button");
    cell.className = "lvl" + (!unlocked ? " locked" : (n === state.highest && !completed ? " current" : ""));
    let html = "";
    if (isBoss) html += '<span class="crown">\u{1F451}</span>';
    html += unlocked ? n : "\u{1F512}";
    if (unlocked && completed) html += '<span class="sub">✓</span>';
    cell.innerHTML = html;
    if (unlocked) cell.onclick = () => startGame(n);
    else cell.disabled = true;
    grid.appendChild(cell);
  }
}

function renderUpgrades() {
  document.getElementById("shopCoins").textContent = shortNum(state.coins);
  const list = document.getElementById("upgradeList");
  list.innerHTML = "";
  for (const u of UPGRADES) {
    const l = upgLevel(u.id);
    const cost = upgCost(u);
    const afford = state.coins >= cost;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="icon">' + u.icon + '</div>' +
      '<div class="info">' +
        '<div><span class="name">' + u.name + '</span><span class="lv">Lv ' + l + '</span></div>' +
        '<div class="blurb">' + u.blurb + '</div>' +
        '<div class="fx">' + u.fx(l) + ' <span class="next">→ ' + u.fx(l + 1) + "</span></div>" +
      '</div>';
    const buy = document.createElement("button");
    buy.className = "buy" + (afford ? "" : " cant");
    buy.innerHTML = "$ " + shortNum(cost);

    buy.onclick = () => {
      if (state.coins >= cost) {

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const TIER_R = [16, 26, 40, 58];
const GRAVITY = 1500;
const BULLET_SPEED = 1150;
const GROUND_H = 100;
const CANNON_HIT_R = 24;

let game = null;
let rafId = 0;

function startGame(levelNumber) {
  game = newGame(levelNumber);
  show("game");
  document.getElementById("hudLevel").textContent = (game.cfg.isBoss ? "BOSS " : "LEVEL ") + levelNumber;
  document.getElementById("hintMap").textContent = game.theme.name.toUpperCase() + " MAP" +
    (state.streak > 0 ? " • \u{1F525}" + state.streak + " (×" + streakMult(state.streak + 1).toFixed(1) + " if you win)" : "") +
    (state.streak >= 3 ? " • BONUS CANNON" : "");
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("gameCoins").textContent = shortNum(state.coins);
  document.getElementById("startHint").classList.add("active");
  document.getElementById("pauseOverlay").classList.remove("active");
  document.getElementById("resultOverlay").classList.remove("active");
  if (!rafId) rafId = requestAnimationFrame(frame);
}

function newGame(levelNumber) {
  const cfg = levelConfig(levelNumber);
  const theme = themeFor(levelNumber);
  return {
    level: levelNumber,
    cfg,
    lo: loadout(),
    gravity: GRAVITY * currentDifficulty().mult,
    theme,
    ballBorder: themeBallBorder(theme),
    decos: makeDecos(THEMES.indexOf(theme)),
    cannon: equipped("cannon"),
    wheel: equipped("wheel"),
    bulletStyle: equipped("bullet"),
    coins: [],
    powerups: [],
    buffs: { shield: 0, twin: 0, spread: 0, coinx: 0 },
    // Win 3+ levels in a row: a bonus mini-cannon fires homing missiles,
    // faster with longer streaks.
    bonus: state.streak >= 3,
    missiles: [],
    missileAcc: 0,
    missileInt: Math.max(1.2, 3 - 0.25 * (state.streak - 3)),
    phase: "ready",            // ready | running | won | lost
    paused: false,
    balls: [],
    bullets: [],
    particles: [],
    floaters: [],
    cannonX: W / 2,
    targetX: W / 2,
    firing: false,
    fireAcc: 0,
    spawnAcc: cfg.interval,    // first ball appears immediately
    spawned: 0,
    fromLeft: true,
    runCoins: 0,
    destroyedHP: 0,
    totalHP: totalHPPool(cfg),
    endTimer: 0,
    lastT: 0,
  };
}

/* Coin pickups drop in four tiers (like collectible studs): the unit
   scales with the popped ball's value so late-game drops stay readable.
   Higher tiers are rarer. Uncollected coins expire after 10 seconds. */
const COIN_TIERS = [
  { mul: 1,  r: 3.5, color: "#c9cdd6" },
  { mul: 2,  r: 4.5, color: "#ffd84d" },
  { mul: 5,  r: 5.5, color: "#5db5ff" },
  { mul: 10, r: 7,   color: "#c95df0" },
];

function spawnCoinDrops(g, x, y, value) {
  // At most 4 drops per pop (same total value, less visual noise).
  const unit = Math.max(1, Math.ceil(value / 8));
  let remaining = value, n = 0;
  while (remaining > 0 && n < 4) {
    let tier = 0;
    const roll = Math.random() * 100;
    if (roll > 95) tier = 3; else if (roll > 82) tier = 2; else if (roll > 55) tier = 1;
    while (tier > 0 && COIN_TIERS[tier].mul * unit > remaining) tier--;
    let v = Math.min(remaining, COIN_TIERS[tier].mul * unit);
    n++;
    if (n === 4 || remaining - v < unit) v = remaining; // fold the leftover in
    remaining -= v;
    g.coins.push({ x, y, vx: (Math.random() * 2 - 1) * 150, vy: 120 + Math.random() * 260,
                   tier, value: v, t: 10, s: Math.random() * Math.PI * 2 });
  }
  if (g.coins.length > 50) { // auto-bank the oldest so performance stays fine
    for (const c of g.coins.splice(0, g.coins.length - 50)) collectCoin(g, c, false);
  }
}

function collectCoin(g, c, floater) {
  g.runCoins += c.value;
  if (floater && c.tier >= 3) {
    g.floaters.push({ x: c.x, y: c.y, text: "+" + shortNum(c.value), t: 0.5 });
  }
  document.getElementById("gameCoins").textContent = shortNum(state.coins + g.runCoins);
}

function updateCoins(dt) {
  const g = game;
  const cx = g.cannonX, cy = GROUND_H + 20;
  const keep = [];
  for (const c of g.coins) {
    c.t -= dt;
    if (c.t <= 0) continue;
    c.vy -= g.gravity * 0.8 * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    const r = COIN_TIERS[c.tier].r;
    if (c.x - r < 0) { c.x = r; c.vx = Math.abs(c.vx); }
    else if (c.x + r > W) { c.x = W - r; c.vx = -Math.abs(c.vx); }
    if (c.y - r <= GROUND_H && c.vy < 0) {
      c.y = GROUND_H + r;
      c.vy = Math.abs(c.vy) > 90 ? -c.vy * 0.4 : 0;
      c.vx *= 0.8;
    }
    if (c.vy === 0) c.vx *= Math.max(0, 1 - 4 * dt);
    const dx = c.x - cx, dy = c.y - cy;
    if (dx * dx + dy * dy < 3600) { collectCoin(g, c, true); continue; }
    keep.push(c);
  }
  g.coins = keep;
}

const twinX = g => Math.min(Math.max(g.cannonX + (g.cannonX > W / 2 ? -100 : 100), 34), W - 34);
const bonusX = g => Math.min(Math.max(g.cannonX - 80, 26), W - 26);

function updatePowerups(dt) {
  const g = game;
  const cx = g.cannonX, cy = GROUND_H + 20;
  const keep = [];
  for (const p of g.powerups) {
    p.t -= dt;
    if (p.t <= 0) continue;
    p.vy -= g.gravity * 0.8 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.x < 16) { p.x = 16; p.vx = Math.abs(p.vx); }
    else if (p.x > W - 16) { p.x = W - 16; p.vx = -Math.abs(p.vx); }
    if (p.y - 13 <= GROUND_H && p.vy < 0) {
      p.y = GROUND_H + 13;
      p.vy = Math.abs(p.vy) > 90 ? -p.vy * 0.35 : 0;
      p.vx *= 0.8;
    }
    const dx = p.x - cx, dy = p.y - cy;
    if (dx * dx + dy * dy < 4900) {
      g.buffs[p.kind] = POWERUPS[p.kind].dur();
      g.floaters.push({ x: p.x, y: p.y + 20, text: POWERUPS[p.kind].name + "!", t: 0.8 });
      if (navigator.vibrate) navigator.vibrate(15);
      continue;
    }
    keep.push(p);
  }
  g.powerups = keep;
}

/* Deterministic scatter of dim background dots (stars, sand, snow...). */
function makeDecos(seed) {
  let s = (seed + 1) * 7919;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const decos = [];
  for (let i = 0; i < 36; i++) {
    decos.push({ x: rnd(), y: rnd(), r: 0.8 + rnd() * 2.2 });
  }
  return decos;
}

function bounceSpeed(g, tier) {
  // Fixed bounce heights as fractions of the playfield, like the original.
  // Deriving from the game's scaled gravity keeps heights identical
  // across difficulties — only the fall speed changes.
  const frac = [0.30, 0.45, 0.60, 0.78][tier];
  const peak = frac * (H - GROUND_H - TIER_R[tier] - 60);
  return Math.sqrt(2 * g.gravity * Math.max(80, peak));
}

function makeBall(g, tier, hp, x, y, vx, vy) {
  return { tier, hp, maxHP: hp, x, y, vx, vy, r: TIER_R[tier] };
}

/* Color is standardized across the level: hue runs from blue (full HP,
   relative to the level's biggest ball) through green/yellow to red at 0.
   The 0.6 exponent makes the shift gradual instead of plunging to red. */
function ballHue(g, ball) {
  const f = Math.max(0, Math.min(1, ball.hp / g.cfg.hp));
  return 210 * Math.pow(f, 0.6);
}
function ballColor(g, ball) {
  return "hsl(" + Math.round(ballHue(g, ball)) + ", 65%, 52%)";
}
/* Ball borders contrast with the level's background: light borders on
   dark maps, dark borders on light maps. Computed once per level. */
function hexLum(hex) {
  const v = parseInt(hex.slice(1), 16);
  return (0.299 * (v >> 16 & 255) + 0.587 * (v >> 8 & 255) + 0.114 * (v & 255)) / 255;
}
function themeBallBorder(theme) {
  const lum = (hexLum(theme.sky[0]) + hexLum(theme.sky[1])) / 2;
  return lum < 0.45 ? "rgba(255,255,255,0.85)" : "rgba(18,18,30,0.7)";
}

canvas.addEventListener("pointerdown", e => {
  if (!game || game.paused || game.phase === "won" || game.phase === "lost") return;
  if (game.phase === "ready") {
    game.phase = "running";
    document.getElementById("startHint").classList.remove("active");
  }
  game.firing = true;
  game.targetX = e.clientX;
});
canvas.addEventListener("pointermove", e => {
  if (game && game.phase === "running" && !game.paused) game.targetX = e.clientX;
});
window.addEventListener("pointerup", () => { if (game) game.firing = false; });
window.addEventListener("pointercancel", () => { if (game) game.firing = false; });
window.addEventListener("blur", () => { if (game) game.firing = false; });

/* ---------- pause / overlays ---------- */

document.getElementById("pauseBtn").onclick = () => {
  if (game && game.phase === "running") {
    game.paused = true;
    document.getElementById("pauseOverlay").classList.add("active");
  }
};
document.getElementById("resumeBtn").onclick = () => {
  game.paused = false;
  game.lastT = 0;
  document.getElementById("pauseOverlay").classList.remove("active");
};
document.getElementById("restartBtn").onclick = () => { bankRunCoins(); startGame(game.level); };
document.getElementById("quitBtn").onclick = () => { bankRunCoins(); leaveGame(); };

document.addEventListener("visibilitychange", () => {
  if (document.hidden && game && game.phase === "running" && !game.paused) {
    game.paused = true;
    document.getElementById("pauseOverlay").classList.add("active");
  }
});

function bankRunCoins() {
  if (game && game.runCoins > 0 && game.phase !== "won" && game.phase !== "lost") {
    state.coins += game.runCoins;
    saveState();
  }
}

function leaveGame() {
  game = null;
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  show("menu");
}

/* ---------- end of run ---------- */

function finishRun(victory) {
  let firstClear = 0, mult = 1, bonus = 0;
  if (victory) {
    state.streak = (state.streak | 0) + 1;
    mult = streakMult(state.streak);
    bonus = Math.round(game.runCoins * (mult - 1));
    if (!state.completed[game.level]) firstClear = 30 + 15 * game.level;
    state.completed[game.level] = true;
    state.highest = Math.max(state.highest, game.level + 1);
  } else {
    state.streak = 0;
  }
  state.coins += game.runCoins + bonus + firstClear;
  saveState();

  document.getElementById("resultTitle").textContent =
    victory ? "LEVEL " + game.level + " CLEAR!" : "GAME OVER";
  document.getElementById("resultTitle").style.color = victory ? "var(--yellow)" : "#f25555";

  let stats = '<div class="row"><span>Coins collected</span><b>+' + shortNum(game.runCoins) + "</b></div>";
  if (victory) {
    stats += '<div class="row"><span>Streak ' + state.streak + " bonus (×" + mult.toFixed(1) + ")</span><b>+" + shortNum(bonus) + "</b></div>";
    if (firstClear) stats += '<div class="row"><span>First clear</span><b>+' + shortNum(firstClear) + "</b></div>";
  } else {
    stats += '<div class="row"><span>Win streak</span><b>lost</b></div>';
  }
  stats += '<hr><div class="row"><span>Total coins</span><b>' + shortNum(state.coins) + "</b></div>";
  document.getElementById("resultStats").innerHTML = stats;

  const btns = document.getElementById("resultButtons");
  btns.innerHTML = "";
  const add = (label, primary, fn) => {
    const b = document.createElement("button");
    b.className = "btn" + (primary ? " primary" : "");
    b.textContent = label;
    b.onclick = fn;
    btns.appendChild(b);
  };
  if (victory) {
    add("Next Level", true, () => startGame(game.level + 1));
    add("Replay", false, () => startGame(game.level));
  } else {
    add("Retry", true, () => startGame(game.level));
  }
  add("Upgrades", false, () => { upgradesReturnTo = "game-result"; show("upgrades"); });
  add("Main Menu", false, leaveGame);

  document.getElementById("gameCoins").textContent = shortNum(state.coins);
  document.getElementById("resultOverlay").classList.add("active");
}

// Returning from the upgrade shop to the result screen.
document.querySelectorAll(".back").forEach(b => {
  const orig = b.onclick;
  b.onclick = () => {
    if (b.dataset.nav === "back" && upgradesReturnTo === "game-result") show("game");
    else orig();
  };
});

/* ---------- simulation ---------- */

function frame(t) {
  rafId = requestAnimationFrame(frame);
  if (!game || currentScreen !== "game") return;

  const ts = t / 1000;
  let dt = game.lastT ? Math.min(ts - game.lastT, 1 / 30) : 1 / 60;
  game.lastT = ts;
  if (game.paused) return;

  update(dt);
  draw();
}

function update(dt) {
  const g = game;

  // Cannon follows the finger.
  const margin = 34;
  const target = Math.min(Math.max(g.targetX, margin), W - margin);
  g.cannonX += (target - g.cannonX) * Math.min(1, dt * 16);

  // Effects keep animating even after the run ends.
  updateParticles(dt);

  if (g.phase === "won" || g.phase === "lost") {
    g.endTimer -= dt;
    if (g.endTimer <= 0 && !document.getElementById("resultOverlay").classList.contains("active")) {
      finishRun(g.phase === "won");
    }
    return;
  }
  if (g.phase !== "running") return;

  // Buffs tick down; unclaimed mystery balls fade out after 14s.
  for (const k in g.buffs) if (g.buffs[k] > 0) g.buffs[k] = Math.max(0, g.buffs[k] - dt);
  g.balls = g.balls.filter(b => !b.mystery || (b.life -= dt) > 0);

  // Boss attacks: telegraphed slams, dashes at the player, minion summons.
  for (const ball of g.balls) {
    if (!ball.isBoss) continue;
    if (Math.abs(ball.vx) > 150) ball.vx *= Math.max(0, 1 - 0.35 * dt); // dash decays
    if (ball.tele > 0) {
      ball.tele -= dt;
      if (ball.tele <= 0) ball.vy = -1500; // slam!
      continue;
    }
    ball.atkT -= dt;
    if (ball.atkT > 0) continue;
    ball.atkT = 4.5 + Math.random() * 3;
    const pick = Math.random();
    if (pick < 0.4) {
      ball.tele = 0.7; // flash, then slam straight down
    } else if (pick < 0.7) {
      ball.vx = (g.cannonX > ball.x ? 1 : -1) * 420; // dash toward the cannon
    } else if (g.balls.length < 24) {
      for (const dir of [-1, 1]) { // summon two minions
        g.balls.push(makeBall(g, 0, Math.max(2, g.cfg.hp >> 3), ball.x, ball.y, 120 * dir, 380));
      }
    }
  }

  // Spawn waves.
  if (g.spawned < g.cfg.count) {
    g.spawnAcc += dt;
    if (g.spawnAcc >= g.cfg.interval) {
      g.spawnAcc = 0;
      g.spawned++;
      const r = TIER_R[g.cfg.tier];
      const x = g.fromLeft ? 50 : W - 50;
      const vx = (90 + Math.random() * 50) * (g.fromLeft ? 1 : -1);
      g.fromLeft = !g.fromLeft;
      const nb = makeBall(g, g.cfg.tier, g.cfg.hp, x, H + r + 10, vx, 0);
      if (g.cfg.isBoss) { nb.isBoss = true; nb.atkT = 3 + Math.random() * 2; nb.tele = 0; }
      g.balls.push(nb);
      // Each spawned ball has a chance (menu setting) to bring a mystery ball.
      if (Math.random() < currentMystery().p) {
        const mtier = 1 + (Math.random() < 0.5 ? 1 : 0); // medium or big
        const mb = makeBall(g, mtier, Math.max(3, g.cfg.hp >> 1), W - x, H + 60, -vx * 0.8, 0);
        mb.mystery = true;
        mb.life = 14;
        g.balls.push(mb);
      }
    }
  }

  // The main cannon fires only while the player is pressing the screen;
  // the twin power-up cannon keeps firing on its own.
  const interval = 1 / g.lo.shotsPerSec;
  if (!g.firing && g.buffs.twin <= 0) {
    g.fireAcc = interval; // primed: first shot lands the moment they press
  } else {
    g.fireAcc += dt;
  }
  let volleys = 0;
  while (g.fireAcc >= interval && volleys < 4) {
    g.fireAcc -= interval;
    volleys++;
    const xs = [];
    if (g.firing) xs.push(g.cannonX);
    if (g.buffs.twin > 0) xs.push(twinX(g));
    for (const cx of xs) {
      const n = g.lo.streams, spacing = 13;
      const startX = cx - spacing * (n - 1) / 2;
      for (let i = 0; i < n; i++) g.bullets.push({ x: startX + i * spacing, y: GROUND_H + 52, vx: 0 });
      // Spread shot only fans out from the main cannon.
      if (g.buffs.spread > 0 && cx === g.cannonX) {
        const pairs = 1 + Math.floor(upgLevel("spreadUp") / 5);
        for (let p = 1; p <= pairs; p++) {
          g.bullets.push({ x: cx, y: GROUND_H + 52, vx: 110 * p });
          g.bullets.push({ x: cx, y: GROUND_H + 52, vx: -110 * p });
        }
      }
    }
  }

  // Bullets.
  for (const b of g.bullets) { b.y += BULLET_SPEED * dt; b.x += b.vx * dt; }
  g.bullets = g.bullets.filter(b => b.y < H + 30 && b.x > -20 && b.x < W + 20);

  // Balls.
  for (const ball of g.balls) {
    ball.vy -= g.gravity * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    else if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r <= GROUND_H && ball.vy < 0) {
      ball.y = GROUND_H + ball.r;
      ball.vy = bounceSpeed(g, ball.tier);
    }
  }

  // Bullets vs balls.
  const keep = [];
  for (const b of g.bullets) {
    let hit = false;
    for (const ball of g.balls) {
      if (ball.hp <= 0) continue;
      const dx = b.x - ball.x, dy = b.y - ball.y, reach = ball.r + 8;
      if (dx * dx + dy * dy <= reach * reach) { ball.hp -= g.lo.bulletDmg; hit = true; break; }
    }
    if (!hit) keep.push(b);
  }
  g.bullets = keep;

  // Bonus cannon: homing missiles seek the nearest ball, 5x bullet damage.
  if (g.bonus) {
    g.missileAcc += dt;
    if (g.missileAcc >= g.missileInt && g.balls.length) {
      g.missileAcc = 0;
      g.missiles.push({ x: bonusX(g), y: GROUND_H + 46, vx: 0, vy: 300, t: 6 });
    }
    const keepM = [];
    for (const mi of g.missiles) {
      mi.t -= dt;
      let best = null, bd = 1e18;
      for (const ball of g.balls) {
        const dx = ball.x - mi.x, dy = ball.y - mi.y, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = ball; }
      }
      if (best) {
        const len = Math.sqrt(bd) || 1;
        mi.vx += ((best.x - mi.x) / len) * 1400 * dt;
        mi.vy += ((best.y - mi.y) / len) * 1400 * dt;
        const sp = Math.hypot(mi.vx, mi.vy) || 1;
        mi.vx = mi.vx / sp * 420;
        mi.vy = mi.vy / sp * 420;
      }
      mi.x += mi.vx * dt;
      mi.y += mi.vy * dt;
      let hit = false;
      if (best) {
        const dx = best.x - mi.x, dy = best.y - mi.y, reach = best.r + 8;
        if (dx * dx + dy * dy <= reach * reach) {
          best.hp -= g.lo.damage * 5;
          burst(mi.x, mi.y, "#ffaa44", 14);
          hit = true;
        }
      }
      if (!hit && mi.t > 0 && mi.y > -30 && mi.y < H + 40 && mi.x > -30 && mi.x < W + 30) keepM.push(mi);
    }
    g.missiles = keepM;
  }

  // Pop dead balls, split big tiers.
  const survivors = [], children = [];
  let popped = false;
  for (const ball of g.balls) {
    if (ball.hp > 0) { survivors.push(ball); continue; }
    popped = true;
    if (ball.mystery) {
      const kinds = Object.keys(POWERUPS);
      const kind = kinds[(Math.random() * kinds.length) | 0];
      g.powerups.push({ x: ball.x, y: ball.y, vx: (Math.random() * 2 - 1) * 80, vy: 220, kind, t: 8 });
      burst(ball.x, ball.y, "#b15df0", ball.r);
      continue;
    }
    g.destroyedHP += ball.maxHP;
    let value = Math.max(1, Math.round(ball.maxHP * COINS_PER_HP * g.lo.coinMult));
    if (g.buffs.coinx > 0) value = Math.round(value * (2 + 0.1 * upgLevel("coinFrenzy")));
    spawnCoinDrops(g, ball.x, ball.y, value);
    burst(ball.x, ball.y, ballColor(g, ball), ball.r);
    if (ball.tier > 0) {
      const childHP = Math.max(1, ball.maxHP >> 1);
      const speed = 80 + Math.random() * 50;
      for (const dir of [-1, 1]) {
        children.push(makeBall(g, ball.tier - 1, childHP, ball.x, ball.y, speed * dir, 420));
      }
    }
  }
  g.balls = survivors.concat(children);
  if (popped) {
    document.getElementById("progressFill").style.width =
      Math.min(100, 100 * g.destroyedHP / g.totalHP) + "%";
    if (navigator.vibrate) navigator.vibrate(8);
  }
  updateCoins(dt);
  updatePowerups(dt);

  // Balls vs cannon — one touch ends the run.
  const cy = GROUND_H + 22;
  for (const ball of g.balls) {
    const dx = ball.x - g.cannonX, dy = ball.y - cy, reach = ball.r + CANNON_HIT_R;
    if (dx * dx + dy * dy < reach * reach) {
      if (g.buffs.shield > 0) {
        // Invincible: knock the ball away instead.
        ball.vy = bounceSpeed(g, ball.tier);
        ball.vx = (ball.x >= g.cannonX ? 1 : -1) * Math.max(80, Math.abs(ball.vx));
        continue;
      }
      g.phase = "lost";
      g.endTimer = 0.8;
      burst(g.cannonX, cy, g.cannon.body, 36);
      if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
      return;
    }
  }

  // Victory: vacuum up any coins still on the field.
  if (g.spawned === g.cfg.count && g.balls.length === 0) {
    for (const c of g.coins) collectCoin(g, c, false);
    g.coins = [];
    g.phase = "won";
    g.endTimer = 0.6;
  }
}

function burst(x, y, color, r) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = r * (1 + Math.random() * 1.4) / 0.35;
    game.particles.push({ x, y, vx: Math.cos(a) * d, vy: Math.sin(a) * d + 60,
                          r: Math.max(3, r * 0.14), color, t: 0.35 });
  }
}

function updateParticles(dt) {
  const g = game;
  for (const p of g.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }
  g.particles = g.particles.filter(p => p.t > 0);
  for (const f of g.floaters) { f.y += 75 * dt; f.t -= dt; }
  g.floaters = g.floaters.filter(f => f.t > 0);
}

/* ---------- rendering ---------- */

function draw() {
  const g = game;
  ctx.clearRect(0, 0, W, H);

  // Themed background and ground (canvas Y is flipped vs the sim: sim Y up, canvas Y down).
  const th = g.theme;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, th.sky[0]);
  grad.addColorStop(1, th.sky[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = th.deco;
  for (const d of g.decos) {
    ctx.beginPath();
    ctx.arc(d.x * W, d.y * (H - GROUND_H) * 0.92, d.r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = th.ground;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = th.line;
  ctx.fillRect(0, H - GROUND_H - 2, W, 3);

  const sy = y => H - y;

  // Bullets.
  const bs = g.bulletStyle;
  ctx.fillStyle = bs.color;
  for (const b of g.bullets) ctx.fillRect(b.x - bs.w / 2, sy(b.y) - bs.h / 2, bs.w, bs.h);

  // Balls.
  for (const ball of g.balls) {
    const bx = ball.x, by = sy(ball.y), r = ball.r;
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI * 2);
    ctx.fillStyle = ball.mystery ? "#b15df0" : ballColor(g, ball);
    ctx.fill();
    // Texture: soft shading toward the bottom-right plus a gloss highlight,
    // clipped to the ball, so balls read as solid 3D objects.
    ctx.save();
    ctx.clip();
    ctx.beginPath();
    ctx.arc(bx + r * 0.22, by + r * 0.28, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,15,0.18)";
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(bx - r * 0.35, by - r * 0.42, r * 0.36, r * 0.22, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.arc(bx, by, r - 1, 0, Math.PI * 2);
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = g.ballBorder;
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "900 " + Math.max(12, ball.r * 0.55) + "px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ball.mystery ? "?" : shortNum(Math.max(0, ball.hp)), ball.x, sy(ball.y));
    if (ball.isBoss) {
      ctx.font = "900 " + Math.max(14, ball.r * 0.45) + "px sans-serif";
      ctx.fillText("\u{1F451}", ball.x, sy(ball.y + ball.r + 14));
      if (ball.tele > 0 && ((ball.tele * 10) | 0) % 2 === 0) {
        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(ball.x, sy(ball.y), ball.r + 4, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  // Power-up pickups.
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const p of g.powerups) {
    if (p.t < 2 && ((p.t * 8) | 0) % 2 === 0) continue;
    ctx.fillStyle = POWERUPS[p.kind].color;
    roundRect(p.x - 13, sy(p.y) - 13, 26, 26, 8);
    ctx.font = "15px sans-serif";
    ctx.fillText(POWERUPS[p.kind].icon, p.x, sy(p.y));
  }

  // Coin pickups: spinning ellipses with a bright rim so they read as
  // collectibles, not balls. Blink when about to expire.
  for (const c of g.coins) {
    if (c.t < 2.5 && ((c.t * 8) | 0) % 2 === 0) continue;
    const ct = COIN_TIERS[c.tier];
    const wob = 0.25 + 0.75 * Math.abs(Math.cos(g.lastT * 5 + c.s));
    ctx.beginPath();
    ctx.ellipse(c.x, sy(c.y), ct.r * wob, ct.r, 0, 0, Math.PI * 2);
    ctx.fillStyle = ct.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.stroke();
  }

  // Streak bonus cannon (mini) and its missiles.
  if (g.bonus && g.phase !== "lost") {
    const bxc = bonusX(g), gy = sy(GROUND_H);
    ctx.save();
    ctx.translate(bxc, gy);
    ctx.scale(0.65, 0.65);
    ctx.translate(-bxc, -gy);
    drawCannon(bxc, gy, g.cannon, g.wheel);
    ctx.restore();
  }
  ctx.fillStyle = "#ffb056";
  for (const mi of g.missiles) {
    ctx.save();
    ctx.translate(mi.x, sy(mi.y));
    ctx.rotate(Math.atan2(mi.vx, mi.vy));
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(5, 6);
    ctx.lineTo(-5, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Cannon (plus twin cannon and shield ring while those buffs are live).
  if (g.phase !== "lost") {
    drawCannon(g.cannonX, sy(GROUND_H), g.cannon, g.wheel);
    if (g.buffs.twin > 0) drawCannon(twinX(g), sy(GROUND_H), g.cannon, g.wheel);
    if (g.buffs.shield > 0) {
      ctx.beginPath();
      ctx.arc(g.cannonX, sy(GROUND_H + 22), 36, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(120,200,255," +
        (g.buffs.shield < 1.5 && (((g.buffs.shield * 8) | 0) % 2 === 0) ? 0.2 : 0.8) + ")";
      ctx.stroke();
    }
  }

  // Active buff readout.
  let bx = 14;
  ctx.font = "700 13px -apple-system, system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (const k in g.buffs) {
    if (g.buffs[k] <= 0) continue;
    const label = POWERUPS[k].icon + " " + Math.ceil(g.buffs[k]) + "s";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.strokeText(label, bx, 92);
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillText(label, bx, 92);
    bx += 64;
  }

  // Particles & floating coin text.
  for (const p of g.particles) {
    ctx.globalAlpha = Math.max(0, p.t / 0.35);
    ctx.beginPath();
    ctx.arc(p.x, sy(p.y), p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "900 16px -apple-system, system-ui, sans-serif";
  for (const f of g.floaters) {
    ctx.globalAlpha = Math.max(0, f.t / 0.6);
    ctx.fillStyle = "#ffd84d";
    ctx.fillText(f.text, f.x, sy(f.y));
  }
  ctx.globalAlpha = 1;
}

function drawCannon(x, groundY, c, w) {
  // Barrel.
  ctx.fillStyle = c.dark;
  roundRect(x - 9, groundY - 58, 18, 38, 5);
  // Body.
  ctx.beginPath();
  ctx.arc(x, groundY - 24, 22, 0, Math.PI * 2);
  ctx.fillStyle = c.body;
  ctx.fill();
  // Visor.
  ctx.fillStyle = c.dark;
  roundRect(x - 13, groundY - 32, 26, 9, 4.5);
  // Wheels.
  for (const wx of [-15, 15]) {
    ctx.beginPath();
    ctx.arc(x + wx, groundY - 10, 10, 0, Math.PI * 2);
    ctx.fillStyle = w.tire;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + wx, groundY - 10, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = w.hub;
    ctx.fill();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}
